name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Quarkus Dev Services start MongoDB and Kafka in containers for the tests.
      - name: Build and run tests
        run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  smoke-jvm:
    name: Smoke test (JVM image)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Show logs
        if: failure()
        run: docker compose logs app
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  smoke-native:
    name: Smoke test (native image)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build native executable
        run: mvn -B package -Dnative -DskipTests -Dquarkus.native.container-build=true
      - name: Start the stack
        run: docker compose up -d --build
        env:
          APP_DOCKERFILE: src/main/docker/Dockerfile.native
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Show logs
        if: failure()
        run: docker compose logs app
      - name: Stop the stack
        if: always()
        run: docker compose down -v
