quarkus.application.name=orderflow

# --- MongoDB ---
# In dev and test mode Quarkus Dev Services starts MongoDB in a container.
quarkus.mongodb.database=orderflow
%prod.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}

# --- Kafka ---
# In dev and test mode Quarkus Dev Services starts a Kafka-compatible broker.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Create the topics up front in dev and test, with several partitions as in production.
quarkus.kafka.devservices.topic-partitions.order-events=3
quarkus.kafka.devservices.topic-partitions.inventory-events=3

# The order module publishes order events and listens for the inventory's answers.
mp.messaging.outgoing.order-events-out.connector=smallrye-kafka
mp.messaging.outgoing.order-events-out.topic=order-events
mp.messaging.outgoing.order-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-events-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.inventory-events-in.connector=smallrye-kafka
mp.messaging.incoming.inventory-events-in.topic=inventory-events
mp.messaging.incoming.inventory-events-in.group.id=orderflow-orders
mp.messaging.incoming.inventory-events-in.auto.offset.reset=earliest
mp.messaging.incoming.inventory-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-events-in.value.deserializer=io.github.ardavan39.orderflow.events.InventoryEventDeserializer
mp.messaging.incoming.inventory-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-events-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.inventory-events-in.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# The inventory module listens for order events and publishes its answers.
mp.messaging.incoming.order-events-in.connector=smallrye-kafka
mp.messaging.incoming.order-events-in.topic=order-events
mp.messaging.incoming.order-events-in.group.id=orderflow-inventory
mp.messaging.incoming.order-events-in.auto.offset.reset=earliest
mp.messaging.incoming.order-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events-in.value.deserializer=io.github.ardavan39.orderflow.events.OrderEventDeserializer
mp.messaging.incoming.order-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.order-events-in.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.inventory-events-out.connector=smallrye-kafka
mp.messaging.outgoing.inventory-events-out.topic=inventory-events
mp.messaging.outgoing.inventory-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-events-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# --- Application ---
# Orders that stay PENDING longer than this get their ORDER_PLACED event published again.
orderflow.republish.after=1m
orderflow.republish.every=30s

# --- HTTP ---
quarkus.smallrye-openapi.info-title=orderflow API
quarkus.swagger-ui.always-include=true
